<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>1-look Skewb Trainer</title>  
        <link rel="stylesheet" href="styles/style.css">
        <script defer src="scripts/main.js"></script>
    </head>
    <body>
        <h1>1-look Skewb Trainer</h1>
        <h2>Select cases and number of random moves to be added after the scramble.</h2>
    </body>
    <div id="case-list">
        <div class="case-button" id="alt-button">
            <img src="images/alt.png">
            <p>Alt</p>
        </div>
        <div class="case-button" id="awkward-button">
            <img src="images/awkward.png">
            <p>Awkward</p>
        </div>
        <div class="case-button" id="basic-insert-button">
            <img src="images/basic insert.png">
            <p>Basic Insert</p>
        </div>
        <div class="case-button" id="double-back-button">
            <img src="images/double back.png">
            <p>Double Back</p>
        </div>
        <div class="case-button" id="double-insert-button">
            <img src="images/double insert.png">
            <p>Double Insert</p>
        </div>
        <div class="case-button" id="double-side-button">
            <img src="images/double side.png">
            <p>Double Side</p>
        </div>
    </div>
</html>
