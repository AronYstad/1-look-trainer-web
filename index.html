<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>1-look Skewb Trainer</title>  
        <link rel="stylesheet" href="styles/style.css">
        <script defer src="scripts/main.js"></script>
    </head>
    <body>
        <h1>1-look Skewb Trainer</h1>
        <h2 id="first-h2">Select cases.</h2>
    </body>
    <div id="case-list">
        <div class="case-button" id="alt-button">
            <img src="images/alt.png">
            <p>Alt</p>
        </div>
        <div class="case-button" id="awkward-button">
            <img src="images/awkward.png">
            <p>Awkward</p>
        </div>
        <div class="case-button" id="basic-insert-button">
            <img src="images/basic insert.png">
            <p>Basic Insert</p>
        </div>
        <div class="case-button" id="double-back-button">
            <img src="images/double back.png">
            <p>Double Back</p>
        </div>
        <div class="case-button" id="double-insert-button">
            <img src="images/double insert.png">
            <p>Double Insert</p>
        </div>
        <div class="case-button" id="double-side-button">
            <img src="images/double side.png">
            <p>Double Side</p>
        </div>
        <div class="case-button" id="long-insert-button">
            <img src="images/long insert.png">
            <p>Long Insert</p>
        </div>
        <div class="case-button" id="nightmare-button">
            <img src="images/nightmare.png">
            <p>Nightmare</p>
        </div>
        <div class="case-button" id="rurprime-button">
            <img src="images/RURprime.png">
            <p>R U R'</p>
        </div>
        <div class="case-button" id="side-insert-button">
            <img src="images/side insert.png">
            <p>Side Insert</p>
        </div>
        <div class="case-button" id="sledge-button">
            <img src="images/sledge.png">
            <p>Sledge</p>
        </div>
        <div class="case-button" id="topside-button">
            <img src="images/topside.png">
            <p>Topside</p>
        </div>
        <div class="case-button" id="twist-button">
            <img src="images/twist.png">
            <p>Twist</p>
        </div>
        <div class="case-button" id="uprimeru-button">
            <img src="images/UprimeRU.png">
            <p>U' R U</p>
        </div>
        <div class="case-button" id="zig-zag-button">
            <img src="images/zig zag.png">
            <p>Zig Zag</p>
        </div>
    </div>
    <h2 id="second-h2">Select number of random moves to be added after the scramble.</h2>
    <input type="number" id="rand-moves-select" min="0" max="10">
    <button type="submit" id="submit-button">Submit</button>
</html>
